# Fair Squares -- Local Development Stack
#
# One-line deploy (full Aztec network + contracts + frontend):
#   docker compose --profile aztec up
#
# This boots Anvil (L1) -> Aztec node (PXE) -> compiles & deploys all 5 Noir
# contracts -> writes contract addresses to a shared volume -> starts the
# frontend with live Aztec connectivity.
#
# Frontend-only (simulation mode, no Aztec needed):
#   docker compose --profile sim up

x-aztec-image: &aztec-image aztecprotocol/aztec:4.2.0-aztecnr-rc.2

services:
  # -- Frontend (live Aztec mode) ----------------------------------------------
  frontend:
    build: ./frontend
    profiles: ["aztec"]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      aztec-bootstrap:
        condition: service_completed_successfully
    environment:
      - NEXT_PUBLIC_DEV_MODE=true
      # Force live mode for the aztec profile. The frontend Docker image sets
      # NEXT_PUBLIC_SIMULATION=true by default, so we must override it here.
      - NEXT_PUBLIC_SIMULATION=false
      - AZTEC_LIVE=true
      # Contract addresses are still loaded from /env/.env.contracts.
      - NEXT_PUBLIC_AZTEC_PXE_URL=http://aztec:8080
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./contracts:/contracts:ro
      - contract-env:/env:ro
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /env/.env.contracts ]; then
          echo "[frontend] Loading contract addresses from bootstrap..."
          cp /env/.env.contracts /app/.env.local
        fi
        exec npm run dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # -- Frontend (simulation only, no Aztec) ------------------------------------
  frontend-sim:
    build: ./frontend
    profiles: ["sim"]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_DEV_MODE=true
      - NEXT_PUBLIC_SIMULATION=true
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # -- Local Ethereum L1 (Anvil) -----------------------------------------------
  anvil:
    image: *aztec-image
    profiles: ["aztec"]
    # Anvil ships inside the Aztec image at /opt/foundry/bin/anvil — no
    # separate foundry image needed.
    # Keep Anvil quiet by default. Override with e.g. ANVIL_LOG_ARG=-v when debugging.
    #
    # IMPORTANT:
    # Aztec local-network sets L1 timestamp interval to 12s. If Anvil mines every 1s,
    # L1 time advances too quickly and sequencer slot checks can stall startup.
    # Default to 12s to keep L1 time progression aligned.
    entrypoint: ["/opt/foundry/bin/anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337", "--block-time", "${ANVIL_BLOCK_TIME:-12}", "${ANVIL_LOG_ARG:---quiet}"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "/opt/foundry/bin/cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # -- Aztec Local Network (PXE + Node) ----------------------------------------
  aztec:
    image: *aztec-image
    profiles: ["aztec"]
    depends_on:
      anvil:
        condition: service_healthy
    command: start --local-network
    ports:
      - "8080:8080"
    environment:
      # Use info by default for readability; override with AZTEC_LOG_LEVEL=debug if needed.
      LOG_LEVEL: ${AZTEC_LOG_LEVEL:-info}
      ETHEREUM_HOSTS: http://anvil:8545
      L1_CHAIN_ID: "31337"
      # Forge L1 deployment can take longer with 12s block times; keep retries resilient.
      FORGE_BROADCAST_TIMEOUT: ${FORGE_BROADCAST_TIMEOUT:-180}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/status"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s

  # -- Bootstrap (compile + deploy contracts) -----------------------------------
  aztec-bootstrap:
    image: *aztec-image
    profiles: ["aztec"]
    working_dir: /workspace
    depends_on:
      aztec:
        condition: service_healthy
    environment:
      - AZTEC_NODE_URL=http://aztec:8080
      - PXE_URL=http://aztec:8080
    volumes:
      - ./:/workspace
      - contract-env:/out
    entrypoint: ["bash", "./scripts/bootstrap-local-network.sh"]
    restart: "no"

volumes:
  contract-env:
