# Fair Squares -- Local Development Stack
#
# Usage:
#   docker compose up                     -> Frontend only (simulation mode, instant)
#   docker compose --profile aztec up     -> Full stack with Aztec local network
#
# The frontend works standalone with an in-memory simulation engine.
# Add the 'aztec' profile when you want real Aztec local network + contract deployment.

services:
  # -- Frontend (always runs) --------------------------------------------------
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_DEV_MODE=true
      - NEXT_PUBLIC_SIMULATION=${SIMULATION:-true}
      - NEXT_PUBLIC_AZTEC_PXE_URL=http://aztec:8080
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./contracts:/contracts:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # -- Local Ethereum L1 (Anvil) -----------------------------------------------
  # The Aztec Docker image requires an external L1 RPC URL.
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles: ["aztec"]
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # -- Aztec Local Network (PXE + Node) ----------------------------------------
  aztec:
    image: aztecprotocol/aztec:4.0.0-devnet.2-patch.0
    profiles: ["aztec"]
    depends_on:
      anvil:
        condition: service_healthy
    command: start --local-network
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL: info
      ETHEREUM_HOSTS: http://anvil:8545
      L1_CHAIN_ID: "31337"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/status"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s

  # -- Bootstrap (compile + deploy contracts) -----------------------------------
  # Uses the same Aztec image so CLI tools (aztec, aztec-wallet) are available.
  aztec-bootstrap:
    image: aztecprotocol/aztec:4.0.0-devnet.2-patch.0
    profiles: ["aztec"]
    working_dir: /workspace
    depends_on:
      aztec:
        condition: service_healthy
    environment:
      - AZTEC_NODE_URL=http://aztec:8080
      - PXE_URL=http://aztec:8080
    volumes:
      - ./:/workspace
    entrypoint: ["sh", "./scripts/bootstrap-local-network.sh"]
    restart: "no"
