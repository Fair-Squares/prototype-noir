# Fair Squares -- Local Development Stack
#
# One-line deploy (full Aztec network + contracts + frontend):
#   docker compose --profile aztec up
#
# This boots Anvil (L1) -> Aztec node (PXE) -> compiles & deploys all 5 Noir
# contracts -> writes contract addresses to a shared volume -> starts the
# frontend with live Aztec connectivity.
#
# Frontend-only (simulation mode, no Aztec needed):
#   docker compose --profile sim up

x-aztec-image: &aztec-image aztecprotocol/aztec:4.0.0-devnet.2-patch.1

services:
  # -- Frontend (live Aztec mode) ----------------------------------------------
  frontend:
    build: ./frontend
    profiles: ["aztec"]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      aztec-bootstrap:
        condition: service_completed_successfully
    environment:
      - NEXT_PUBLIC_DEV_MODE=true
      - NEXT_PUBLIC_SIMULATION=false
      - AZTEC_LIVE=true
      - NEXT_PUBLIC_AZTEC_PXE_URL=http://aztec:8080
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./contracts:/contracts:ro
      - contract-env:/env:ro
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /env/.env.contracts ]; then
          echo "[frontend] Loading contract addresses from bootstrap..."
          cp /env/.env.contracts /app/.env.local
        fi
        exec npm run dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # -- Frontend (simulation only, no Aztec) ------------------------------------
  frontend-sim:
    build: ./frontend
    profiles: ["sim"]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_DEV_MODE=true
      - NEXT_PUBLIC_SIMULATION=true
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # -- Local Ethereum L1 (Anvil) -----------------------------------------------
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles: ["aztec"]
    # Use entrypoint (not command) to bypass the image's /bin/sh -c entrypoint
    # which would otherwise eat the --host flag as positional args, making
    # Anvil default to 127.0.0.1 (inaccessible from other containers).
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # -- Aztec Local Network (PXE + Node) ----------------------------------------
  aztec:
    image: *aztec-image
    profiles: ["aztec"]
    depends_on:
      anvil:
        condition: service_healthy
    command: start --local-network
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL: debug
      ETHEREUM_HOSTS: http://anvil:8545
      L1_CHAIN_ID: "31337"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/status"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s

  # -- Bootstrap (compile + deploy contracts) -----------------------------------
  aztec-bootstrap:
    image: *aztec-image
    profiles: ["aztec"]
    working_dir: /workspace
    depends_on:
      aztec:
        condition: service_healthy
    environment:
      - AZTEC_NODE_URL=http://aztec:8080
      - PXE_URL=http://aztec:8080
    volumes:
      - ./:/workspace
      - contract-env:/out
    entrypoint: ["sh", "./scripts/bootstrap-local-network.sh"]
    restart: "no"

volumes:
  contract-env:
