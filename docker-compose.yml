# Fair Squares -- Local Development Stack
#
# One-line deploy (full Aztec network + contracts + frontend):
#   docker compose --profile aztec up
#
# This boots a single Aztec local-network container (which runs its OWN
# automine Anvil L1 + Aztec node + PXE in-process) -> compiles & deploys all
# Noir contracts -> writes contract addresses to a shared volume -> starts the
# frontend with live Aztec connectivity.
#
# Frontend-only (simulation mode, no Aztec needed):
#   docker compose --profile sim up
#
# WHY ONE SERVICE (and why it's fast):
#   `aztec start --local-network` is designed to manage its own L1. The node
#   ships an `AnvilTestWatcher` that, WHEN ANVIL IS IN AUTOMINE MODE, warps L1
#   time to the next L2 slot ~2 s after a tx is pending -- giving near-instant
#   blocks. The previous setup ran a SEPARATE anvil with `--block-time 12`
#   (interval mining), which makes `isAutoMining()` return false, so the watcher
#   never starts and every tx waits a full wall-clock slot (~22 s). Across ~22
#   bootstrap txs that was ~10 min. Here the entrypoint starts `anvil` with NO
#   `--block-time` (automine) in the same container, so the watcher kicks in and
#   the whole bootstrap lands in well under a minute.

x-aztec-image: &aztec-image aztecprotocol/aztec:4.3.0

services:
  # -- Frontend (live Aztec mode) ----------------------------------------------
  frontend:
    build: ./frontend
    profiles: ["aztec"]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      aztec-bootstrap:
        condition: service_completed_successfully
    environment:
      - NEXT_PUBLIC_DEV_MODE=true
      # Force live mode for the aztec profile. The frontend Docker image sets
      # NEXT_PUBLIC_SIMULATION=true by default, so we must override it here.
      - NEXT_PUBLIC_SIMULATION=false
      - AZTEC_LIVE=true
      # Contract addresses are still loaded from /env/.env.contracts.
      - NEXT_PUBLIC_AZTEC_PXE_URL=http://aztec:8080
      - NEXT_TELEMETRY_DISABLED=1
      # Proverless by default (a local network never needs client proofs); the
      # server-side EmbeddedWallet reads this and skips ClientIVC proof
      # generation (~4 s/tx). Override to true only for proving-realism tests.
      - PXE_PROVER_ENABLED=${PXE_PROVER_ENABLED:-false}
      # Surface the live chain timing so /api/chain/params (Reference page)
      # reflects the network's slot duration. local-network uses the protocol
      # default (36 s L2 / 12 s L1); with automine the watcher warps across it,
      # so this is a DISPLAY value only -- it does not gate wall-clock speed.
      - AZTEC_SLOT_DURATION=${AZTEC_SLOT_DURATION:-36}
      - ETHEREUM_SLOT_DURATION=${ETHEREUM_SLOT_DURATION:-12}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./contracts:/contracts:ro
      - contract-env:/env:ro
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /env/.env.contracts ]; then
          echo "[frontend] Loading contract addresses from bootstrap..."
          cp /env/.env.contracts /app/.env.local
        fi
        exec npm run dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # -- Seed tradable FSFT into all three accounts (real distribution flow) ------
  # Runs once the frontend is healthy and drives the live API routes:
  #   deposit x3 -> create proposal -> vote x2 -> finalize -> execute (opens the
  #   distribution) -> claim x3, so test0/1/2 each hold private FSFT minted from
  #   an executed fund proposal — ready to sell on the DEX. One-shot; exits 0.
  # Reuses the proven server-side wallet via HTTP (reliable, unlike a fresh PXE).
  fsft-seed:
    image: *aztec-image
    profiles: ["aztec"]
    working_dir: /workspace
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      - FRONTEND_URL=http://frontend:3000
    volumes:
      - ./:/workspace
    entrypoint: ["bash", "./scripts/seed-fsft.sh"]
    restart: "no"

  # -- Frontend (simulation only, no Aztec) ------------------------------------
  frontend-sim:
    build: ./frontend
    profiles: ["sim"]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_DEV_MODE=true
      - NEXT_PUBLIC_SIMULATION=true
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # -- Aztec Local Network (automine L1 + Node + PXE, single container) ---------
  # The image ENTRYPOINT is the raw node binary, which does NOT auto-start anvil
  # (only the `aztec.sh` host wrapper does). So we replicate the wrapper's
  # local-network preamble here: start an AUTOMINE anvil (no --block-time) and
  # point the node at it via ETHEREUM_HOSTS=127.0.0.1. Automine is the whole
  # ballgame -- it's what activates the node's slot-warping watcher.
  aztec:
    image: *aztec-image
    profiles: ["aztec"]
    ports:
      - "8080:8080"
      # Expose the in-container L1 for debugging (cast block-number, etc.).
      - "8545:8545"
    environment:
      # info, but silence the per-slot sequencer chatter for readable logs
      # (matches the host wrapper's local-network default).
      LOG_LEVEL: ${AZTEC_LOG_LEVEL:-info;silent:sequencer}
      L1_CHAIN_ID: "31337"
      # Point the node at the automine anvil started in the entrypoint below.
      ETHEREUM_HOSTS: http://127.0.0.1:8545
      # Ship the prefunded test accounts (test0/test1/test2) on start.
      TEST_ACCOUNTS: "true"
      # Fast polling intervals -- copied from the `aztec.sh` local-network path
      # so the node reacts to new txs/blocks within ~500 ms.
      ARCHIVER_POLLING_INTERVAL_MS: "500"
      P2P_BLOCK_CHECK_INTERVAL_MS: "500"
      SEQ_TX_POLLING_INTERVAL_MS: "500"
      WS_BLOCK_CHECK_INTERVAL_MS: "500"
      ARCHIVER_VIEM_POLLING_INTERVAL_MS: "500"
      # Per-tx latency knobs for fast local iteration. On a single-node network
      # there is no real p2p, so the 2 s attestation-propagation assumption and
      # the 2 s minimum tx-pool age are pure delay stacked on every tx. Zero them
      # so a tx is included as soon as the automine watcher warps the slot
      # (~6.5 s/tx -> ~3 s/tx across the ~26 bootstrap txs).
      P2P_MIN_TX_POOL_AGE_MS: "0"
      SEQ_ATTESTATION_PROPAGATION_TIME: "0"
      # Proverless client/wallet (the node already runs realProofs=false on a
      # local network). Saves ~4 s/tx of ClientIVC proving. Set true for realism.
      PXE_PROVER_ENABLED: ${PXE_PROVER_ENABLED:-false}
      # Governance demo timing: shrink the voting window + zero the exit delay.
      AZTEC_GOVERNANCE_VOTING_DURATION: ${AZTEC_GOVERNANCE_VOTING_DURATION:-300}
      AZTEC_EXIT_DELAY_SECONDS: ${AZTEC_EXIT_DELAY_SECONDS:-0}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "[aztec] starting automine anvil (no --block-time) on :8545"
        anvil --silent --host 0.0.0.0 --port 8545 &
        echo "[aztec] waiting for L1..."
        until cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; do sleep 0.2; done
        echo "[aztec] L1 up; launching local-network node + PXE"
        exec node --no-warnings /usr/src/yarn-project/aztec/dest/bin/index.js start --local-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/status"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 120s

  # -- Bootstrap (compile + deploy contracts) -----------------------------------
  aztec-bootstrap:
    image: *aztec-image
    profiles: ["aztec"]
    working_dir: /workspace
    depends_on:
      aztec:
        condition: service_healthy
    environment:
      - AZTEC_NODE_URL=http://aztec:8080
      - PXE_URL=http://aztec:8080
      # Proverless deploys by default. The cli-wallet reads PXE_PROVER (value
      # "none"), NOT PXE_PROVER_ENABLED, so set both: PXE_PROVER=none disables
      # the cli-wallet's ClientIVC proving (~4 s/tx across ~22 bootstrap txs).
      - PXE_PROVER_ENABLED=${PXE_PROVER_ENABLED:-false}
      - PXE_PROVER=${PXE_PROVER:-none}
      # Short governance voting window for the local demo: 5 blocks. Blocks are
      # produced on-demand (only when there are txs), so the window advances
      # with on-chain activity rather than wall-clock time.
      - GOVERNANCE_VOTING_WINDOW_BLOCKS=${GOVERNANCE_VOTING_WINDOW_BLOCKS:-5}
      # cli-wallet sets maxFeesPerGas = currentMinFees * (1 + MIN_FEE_PADDING).
      # Too low (default 0.5) -> fee spikes break deploys. Too high (1000) ->
      # wallet pre-reservation exceeds account fee-juice balance and we get
      # "Insufficient fee payer balance". 30 is the working baseline; the
      # bootstrap script auto-retries spikes that exceed it.
      - WALLET_MIN_FEE_PADDING=${WALLET_MIN_FEE_PADDING:-30}
    volumes:
      - ./:/workspace
      - contract-env:/out
      # Persist nargo's git-dependency cache (aztec-packages v4.3.0 is a ~12k-file
      # clone) so re-bootstraps don't re-fetch deps every time. NARGO_HOME defaults
      # to /root/.nargo (HOME=/root in the image).
      - nargo-cache:/root/.nargo
    entrypoint: ["bash", "./scripts/bootstrap-local-network.sh"]
    restart: "no"

volumes:
  contract-env:
  nargo-cache:
