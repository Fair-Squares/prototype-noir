name: tests

# Runs the Noir/Aztec contract test suite and the frontend unit tests on every
# push to a main/working branch and on pull requests. Keeps test coverage from
# silently regressing (previously nothing ran on push/PR).
on:
  push:
    branches: [main, "claude/**", "ccr-**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Noir / Aztec contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The Aztec host CLI installer requires Node >= 24.12.0.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Speeds up reruns: the bb verification-key cache and the nargo git-dep
      # cache are the slow parts of `aztec test`. The toolchain version is
      # pinned once, in .aztec-version (read by scripts/ci/install-aztec.sh).
      - name: Cache bb VK + nargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bb
            ~/nargo
          key: aztec-${{ hashFiles('.aztec-version') }}-${{ runner.os }}-${{ hashFiles('contracts/**/Nargo.toml') }}
          restore-keys: |
            aztec-${{ hashFiles('.aztec-version') }}-${{ runner.os }}-

      # NOT `bash <(curl install.aztec.network/<v>)`: the frozen per-version
      # installer bundles foundry via the moving foundryup bootstrap, which now
      # emits symlinked binaries and makes the installer abort with
      # "expected bundled binary 'forge' missing". Compile + TXE tests never
      # need forge/anvil, so the wrapper script runs the upstream installer with
      # the foundry step made best-effort (see scripts/ci/install-aztec.sh).
      - name: Install Aztec toolchain
        run: |
          ./scripts/ci/install-aztec.sh
          echo "$HOME/.aztec/current/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: aztec --version

      - name: Run contract test suite
        run: ./scripts/aztec-test.sh

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      - name: Type-check
        run: npm run typecheck
